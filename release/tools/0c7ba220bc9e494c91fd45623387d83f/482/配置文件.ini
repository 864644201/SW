关于如何增加材料密度：

    请按照材料密度的顺序及格式添加材料密度，默认第一项的材料密度不作为添加密度信息项。

注意：您添加或修改了材料密度之后，需要重新运行本程序才可以更新您所添加或修改的材料密度信息！

本配置文件默认保存在您运行本程序的目录中。

