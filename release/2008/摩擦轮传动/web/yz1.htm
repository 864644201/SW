<div class=Section1 style='layout-grid:15.6pt'>

<p class=MsoNormal><span style='font-size:12.0pt;font-family:宋体;mso-ascii-font-family:
"Times New Roman";mso-hansi-font-family:"Times New Roman"'>本界面主要用来输入圆柱摩擦轮相关的初始参数：</span><span
lang=EN-US style='font-size:12.0pt'><o:p></o:p></span></p>

<p class=MsoNormal><span lang=EN-US style='font-size:12.0pt'>1</span><span
style='font-size:12.0pt;font-family:宋体;mso-ascii-font-family:"Times New Roman";
mso-hansi-font-family:"Times New Roman"'>、传动功率</span><span lang=EN-US
style='font-size:12.0pt'>P<sub>1</sub></span><span style='font-size:12.0pt;
font-family:宋体;mso-ascii-font-family:"Times New Roman";mso-hansi-font-family:
"Times New Roman"'>表示摩擦轮的工作功率，单位为</span><span lang=EN-US style='font-size:12.0pt'>kW</span><span
style='font-size:12.0pt;font-family:宋体;mso-ascii-font-family:"Times New Roman";
mso-hansi-font-family:"Times New Roman"'>。</span><span lang=EN-US
style='font-size:12.0pt'><o:p></o:p></span></p>

<p class=MsoNormal><span lang=EN-US style='font-size:12.0pt'>2</span><span
style='font-size:12.0pt;font-family:宋体;mso-ascii-font-family:"Times New Roman";
mso-hansi-font-family:"Times New Roman"'>、主动轴转速</span><span lang=EN-US
style='font-size:12.0pt'>n<sub>1</sub></span><span style='font-size:12.0pt;
font-family:宋体;mso-ascii-font-family:"Times New Roman";mso-hansi-font-family:
"Times New Roman"'>，其单位为</span><span lang=EN-US style='font-size:12.0pt'>r/min</span><span
style='font-size:12.0pt;font-family:宋体;mso-ascii-font-family:"Times New Roman";
mso-hansi-font-family:"Times New Roman"'>。</span><span lang=EN-US
style='font-size:12.0pt'><o:p></o:p></span></p>

<p class=MsoNormal><span lang=EN-US style='font-size:12.0pt'>3</span><span
style='font-size:12.0pt;font-family:宋体;mso-ascii-font-family:"Times New Roman";
mso-hansi-font-family:"Times New Roman"'>、从动轴转速</span><span lang=EN-US
style='font-size:12.0pt'>n<sub>2</sub></span><span style='font-size:12.0pt;
font-family:宋体;mso-ascii-font-family:"Times New Roman";mso-hansi-font-family:
"Times New Roman"'>，其单位为</span><span lang=EN-US style='font-size:12.0pt'>r/min</span><span
style='font-size:12.0pt;font-family:宋体;mso-ascii-font-family:"Times New Roman";
mso-hansi-font-family:"Times New Roman"'>，在给定主动轴转速及传</span><span lang=EN-US
style='font-size:12.0pt'><o:p></o:p></span></p>

<p class=MsoNormal style='text-indent:18.0pt;mso-char-indent-count:1.5;
mso-char-indent-size:12.0pt'><span style='font-size:12.0pt;font-family:宋体;
mso-ascii-font-family:"Times New Roman";mso-hansi-font-family:"Times New Roman"'>动比时，可以实现联动计算，系统自动计算出从动轴转速。</span><span
lang=EN-US style='font-size:12.0pt'><o:p></o:p></span></p>

<p class=MsoNormal><span lang=EN-US style='font-size:12.0pt'>4</span><span
style='font-size:12.0pt;font-family:宋体;mso-ascii-font-family:"Times New Roman";
mso-hansi-font-family:"Times New Roman"'>、传动比</span><span lang=EN-US
style='font-size:12.0pt'>I</span><span style='font-size:12.0pt;font-family:
宋体;mso-ascii-font-family:"Times New Roman";mso-hansi-font-family:"Times New Roman"'>，计算公式为：</span><span
lang=EN-US style='font-size:12.0pt'>I= n<sub>1</sub> /n<sub>2</sub></span><span
style='font-size:12.0pt;font-family:宋体;mso-ascii-font-family:"Times New Roman";
mso-hansi-font-family:"Times New Roman"'>，在给定主动轴转速和从</span><span lang=EN-US
style='font-size:12.0pt'><o:p></o:p></span></p>

<p class=MsoNormal style='text-indent:18.0pt;mso-char-indent-count:1.5;
mso-char-indent-size:12.0pt'><span style='font-size:12.0pt;font-family:宋体;
mso-ascii-font-family:"Times New Roman";mso-hansi-font-family:"Times New Roman"'>动轴转速的时，系统自动计算传动比。</span><span
lang=EN-US style='font-size:12.0pt'><o:p></o:p></span></p>

<p class=MsoNormal style='margin-right:.12gd'><span lang=EN-US
style='font-size:12.0pt'>5</span><span style='font-size:12.0pt;font-family:
宋体;mso-ascii-font-family:"Times New Roman";mso-hansi-font-family:"Times New Roman"'>、接触形式，选择接触方式为内接触或者外接触。</span><span
lang=EN-US style='font-size:12.0pt'><o:p></o:p></span></p>

</div>
