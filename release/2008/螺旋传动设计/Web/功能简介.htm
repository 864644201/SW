<p class=MsoNormal><b><span style='font-family:宋体'>功能简介</span></b></p>

<p class=MsoNormal><span lang=EN-US>&nbsp; </span><span style='font-family:
宋体'>本系统实现了螺旋传动的设计计算和数据库查询，设计中主要包括滑动螺旋传动设计和滚动螺旋传动设计。数据库查询包括螺旋传动设计过程中常用参数的查询和计算公式的查询。系统的主界面如下：</span></p>

<p class=MsoNormal><span lang=EN-US><img width=428 height=365
src="功能简介.files/image001.jpg"></span></p>

<p class=MsoNormal><span style='font-family:宋体'>其中左区为导航区，右区为工作区，工作区分为“工作空间”、“设计记录”和“数据库查询”，</span></p>

<p class=MsoNormal><span style='font-family:宋体'>当用户在进行设计计算时工作区为“工作空间”，如下图所示：</span></p>

<p class=MsoNormal><span lang=EN-US><img width=452 height=385
src="功能简介.files/image002.jpg"></span></p>

<p class=MsoNormal><span style='font-family:宋体'>要查看设计记录时点击工作区中的“设计记录”选项，出现如下界面：</span></p>

<p class=MsoNormal><span lang=EN-US><img width=480 height=409
src="功能简介.files/image003.jpg"></span></p>

<p class=MsoNormal><span style='font-family:宋体'>设计记录保存了当前设计过程中的主要参数和计算结果。</span></p>

<p class=MsoNormal><span style='font-family:宋体'>点击“公式查询”选项出项如下界面：</span></p>

<p class=MsoNormal style='margin-left:-.1pt'><span lang=EN-US><img width=480
height=410 src="功能简介.files/image004.jpg"></span></p>

<p class=MsoNormal><span style='font-family:宋体'>用户可以在该界面中查询相应的设计参数数据及计算公式。</span></p>
